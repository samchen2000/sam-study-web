<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section 範例</title>
    
    <!-- 引入 Google Fonts 字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">

    <style>
        /* --- 全域設定 --- */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif; /* 預設內文字體 */
        }

        /* --- Hero Section 樣式 --- */
        .hero-section {
            /* 1. 背景圖片設定 */
            /* 請將 'your-image-url.jpg' 替換成您自己的高畫質圖片網址 */
            background-image: url('https://images.unsplash.com/photo-1501555088652-021faa106b9b?q=80&w=2073&auto=format&fit=crop');
            background-size: cover; /* 圖片填滿整個區塊 */
            background-position: center; /* 圖片置中顯示 */
            height: 85vh; /* 區塊高度佔螢幕可視高度的 85% */
            
            /* 2. Flexbox 置中內容 */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            /* 3. 為了疊加層，設定相對定位 */
            position: relative;
            color: #FDFDFD; /* 設定區塊內文字為雪花白，以確保在深色疊加層上的可讀性 */
        }

        /* 4. 半透明疊加層 (提升文字可讀性) */
        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(44, 62, 80, 0.5); /* 使用深灰藍 (#2C3E50) 加上 50% 的透明度 */
            z-index: 1; /* 確保疊加層在背景圖之上，內容之下 */
        }

        /* 5. 內容容器 */
        .hero-content {
            position: relative; /* 確保內容在疊加層之上 */
            z-index: 2;
            max-width: 800px; /* 限制內容最大寬度，避免文字過長 */
            padding: 0 20px; /* 左右留白 */
        }

        /* 6. 主標題 (H1) */
        .hero-title {
            font-family: 'Noto Serif TC', serif; /* 使用思源宋體 */
            font-size: 3.5rem; /* 設定大字體尺寸 */
            font-weight: 600;
            margin: 0 0 1rem 0; /* 與下方副標題的間距 */
        }

        /* 7. 副標題 (Tagline) */
        .hero-tagline {
            font-size: 1.25rem;
            font-weight: 400;
            line-height: 1.6;
            opacity: 0.9; /* 讓副標題稍微柔和一點 */
            margin: 0 0 2rem 0; /* 與下方社群連結的間距 */
        }

        /* 8. 社群連結 */
        .social-links a {
            color: #FDFDFD;
            text-decoration: none;
            margin: 0 15px; /* 圖示之間的間距 */
            transition: opacity 0.3s ease; /* 加入平滑過渡效果 */
        }

        .social-links a:hover {
            opacity: 0.7; /* 滑鼠懸停時變淡 */
        }

        .social-links svg {
            width: 28px; /* 設定圖示大小 */
            height: 28px;
        }

        /* --- 響應式設計 (手機版) --- */
        @media (max-width: 768px) {
            .hero-section {
                height: 70vh; /* 在手機上稍微降低高度 */
            }
            .hero-title {
                font-size: 2.5rem; /* 縮小主標題字體 */
            }
            .hero-tagline {
                font-size: 1rem; /* 縮小副標題字體 */
            }
            .social-links svg {
                width: 24px;
                height: 24px;
            }
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">你好，我是 [你的名字]</h1>
            <p class="hero-tagline">一個用影像與文字，記錄學習、旅行與家庭溫度的生活探索者。</p>
            <div class="social-links">
                <!-- YouTube Icon -->
                <a href="[你的YouTube連結]" target="_blank" aria-label="YouTube">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21.582,6.186c-0.23-0.86-0.908-1.538-1.768-1.768C18.254,4,12,4,12,4S5.746,4,4.186,4.418 c-0.86,0.23-1.538,0.908-1.768,1.768C2,7.746,2,12,2,12s0,4.254,0.418,5.814c0.23,0.86,0.908,1.538,1.768,1.768 C5.746,20,12,20,12,20s6.254,0,7.814-0.418c0.861-0.23,1.538-0.908,1.768-1.768C22,16.254,22,12,22,12S22,7.746,21.582,6.186z M10,15.464V8.536L16,12L10,15.464z"/></svg>
                </a>
                <!-- Instagram Icon -->
                <a href="[你的Instagram連結]" target="_blank" aria-label="Instagram">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12,2c-2.717,0-3.056,0.01-4.122,0.06c-1.065,0.05-1.79,0.217-2.428,0.465c-0.66,0.255-1.214,0.588-1.77,1.144 c-0.556,0.556-0.89,1.11-1.144,1.77C2.277,6.21,2.11,6.935,2.06,8.002C2.01,9.066,2,9.305,2,12s0.01,2.934,0.06,4.002 c0.05,1.065,0.217,1.79,0.465,2.428c0.255,0.66,0.588,1.214,1.144,1.77c0.556,0.556,1.11,0.89,1.77,1.144 c0.638,0.248,1.363,0.415,2.428,0.465c1.066,0.05,1.405,0.06,4.122,0.06s3.056-0.01,4.122-0.06 c1.065-0.05,1.79-0.217,2.428-0.465c0.66-0.255,1.214-0.588,1.77-1.144c0.556-0.556,0.89-1.11,1.144-1.77 c0.248-0.638,0.415-1.363,0.465-2.428c0.05-1.066,0.06-1.405,0.06-4.122s-0.01-2.934-0.06-4.002 c-0.05-1.065-0.217-1.79-0.465-2.428c-0.255-0.66-0.588-1.214-1.77-1.144C20.088,3.11,19.534,2.777,18.874,2.522 c-0.638-0.248-1.363-0.415-2.428-0.465C15.356,2.01,15.017,2,12,2z M12,7c-2.761,0-5,2.239-5,5s2.239,5,5,5s5-2.239,5-5 S14.761,7,12,7z M12,15c-1.657,0-3-1.343-3-3s1.343-3,3-3s3,1.343,3,3S13.657,15,12,15z M16.804,6.116 c-0.596,0-1.08,0.484-1.08,1.08s0.484,1.08,1.08,1.08c0.596,0,1.08-0.484,1.08-1.08S17.401,6.116,16.804,6.116z"/></svg>
                </a>
                <!-- Facebook Icon (或其他) -->
                <a href="[你的Facebook連結]" target="_blank" aria-label="Facebook">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12,2C6.477,2,2,6.477,2,12c0,5.013,3.657,9.128,8.438,9.878V14.89h-2.54V12h2.54V9.797 c0-2.506,1.492-3.89,3.777-3.89c1.094,0,2.238,0.195,2.238,0.195v2.46h-1.26c-1.243,0-1.63,0.771-1.63,1.562V12h2.773l-0.443,2.89 h-2.33V21.878C18.343,21.128,22,17.013,22,12C22,6.477,17.523,2,12,2z"/></svg>
                </a>
            </div>
        </div>
    </section>

</body>
</html>
