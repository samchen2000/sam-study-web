<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title description">
  <title id="title">景深範圍與超焦距示意圖</title>
  <desc id="description">說明 CoC 與超焦距公式，以及對焦距離接近或超過超焦距時遠景深延伸至無限遠。</desc>
  <defs>
    <linearGradient id="depth-fill" x1="0" x2="1">
      <stop offset="0" stop-color="#E67E22" stop-opacity=".18"/>
      <stop offset=".48" stop-color="#E67E22" stop-opacity=".48"/>
      <stop offset="1" stop-color="#E67E22" stop-opacity=".22"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#E67E22"/>
    </marker>
    <marker id="arrow-dark" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#2C3E50"/>
    </marker>
    <style>
      text { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
      .ink { fill: #2C3E50; }
      .muted { fill: #6A737D; }
      .accent { fill: #E67E22; }
      .card { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 2; }
      .small { font-size: 22px; }
      .medium { font-size: 27px; }
      .large { font-size: 34px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="1160" fill="#FDFDFD"/>
  <text x="76" y="91" class="ink" font-size="52" font-weight="700">景深範圍與超焦距</text>
  <text x="78" y="134" class="muted" font-size="24">焦距、光圈與允許彌散圓共同決定清晰範圍；以下以精確薄透鏡模型示意</text>

  <g>
    <rect x="70" y="170" width="460" height="150" rx="12" fill="#FFFBE6" stroke="#E8DCA8" stroke-width="2"/>
    <text x="98" y="214" class="muted small">允許彌散圓 CoC</text>
    <text x="98" y="263" class="ink large">像素大小 × 倍數</text>
    <text x="98" y="300" class="muted small">p（mm） × k = CoC（mm）</text>
  </g>
  <g>
    <rect x="570" y="170" width="460" height="150" rx="12" class="card"/>
    <text x="598" y="214" class="muted small">精確超焦距：建議對焦位置</text>
    <text x="598" y="272" class="ink large">H = f² / (N × CoC) + f</text>
    <text x="598" y="305" class="muted small">f、H 與 CoC 使用相同長度單位</text>
  </g>
  <g>
    <rect x="1070" y="170" width="460" height="150" rx="12" class="card"/>
    <text x="1098" y="214" class="muted small">簡化超焦距：遠距離近似</text>
    <text x="1098" y="272" class="ink large">H′ = f² / (N × CoC)</text>
    <text x="1098" y="305" class="muted small">精確值 H 比簡化值 H′ 多一個 f</text>
  </g>

  <rect x="70" y="350" width="1460" height="435" rx="14" class="card"/>
  <text x="105" y="402" class="ink" font-size="31" font-weight="700">對焦在超焦距 H 時的景深範圍</text>
  <text x="107" y="442" class="muted small">距離軸由近至遠（示意，非等比例）</text>

  <rect x="185" y="515" width="355" height="74" rx="10" fill="#EEF1F4"/>
  <rect x="540" y="515" width="870" height="74" rx="10" fill="url(#depth-fill)"/>
  <line x1="185" y1="552" x2="1425" y2="552" stroke="#AAB3BB" stroke-width="3"/>
  <line x1="540" y1="500" x2="540" y2="615" stroke="#E67E22" stroke-width="4" stroke-dasharray="9 8"/>
  <line x1="860" y1="475" x2="860" y2="620" stroke="#2C3E50" stroke-width="5"/>
  <circle cx="860" cy="552" r="13" fill="#2C3E50"/>
  <line x1="875" y1="552" x2="1410" y2="552" stroke="#E67E22" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="205" y="505" class="muted small">近景（不在景深內）</text>
  <text x="540" y="480" text-anchor="middle" class="accent medium" font-weight="700">近景深界限 ≈ H / 2</text>
  <text x="860" y="465" text-anchor="middle" class="ink medium" font-weight="700">對焦位置 H</text>
  <text x="1390" y="505" text-anchor="end" class="accent medium" font-weight="700">遠景深 → ∞</text>
  <line x1="558" y1="640" x2="842" y2="640" stroke="#2C3E50" stroke-width="2.5" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)"/>
  <text x="700" y="677" text-anchor="middle" class="ink small">前景深約 H / 2</text>
  <line x1="878" y1="640" x2="1380" y2="640" stroke="#E67E22" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="1128" y="677" text-anchor="middle" class="ink small">後景深延伸至無限遠</text>

  <rect x="108" y="705" width="1384" height="52" rx="8" fill="#FFF8F0"/>
  <text x="132" y="740" class="ink small">在 H 對焦可讓遠方納入清晰範圍；近景界限約在 H/2，精確值依所用薄透鏡公式計算。</text>

  <text x="78" y="844" class="ink" font-size="30" font-weight="700">對焦距離逐漸接近 H，遠景深快速增加</text>
  <text x="80" y="882" class="muted small">示意比較（距離條長度不按比例）</text>

  <g>
    <rect x="70" y="910" width="350" height="175" rx="12" class="card"/>
    <text x="98" y="955" class="ink medium" font-weight="700">s &lt; H</text>
    <text x="98" y="992" class="muted small">遠景深有限</text>
    <rect x="100" y="1018" width="92" height="15" rx="7" fill="#E67E22" opacity=".65"/>
    <text x="210" y="1033" class="ink small">可算出有限遠界</text>
  </g>
  <g>
    <rect x="445" y="910" width="350" height="175" rx="12" class="card"/>
    <text x="473" y="955" class="ink medium" font-weight="700">s → H</text>
    <text x="473" y="992" class="muted small">後景深迅速擴大</text>
    <rect x="475" y="1018" width="225" height="15" rx="7" fill="#E67E22" opacity=".65"/>
    <text x="716" y="1033" class="ink small">持續增加</text>
  </g>
  <g>
    <rect x="820" y="910" width="350" height="175" rx="12" fill="#FFFBE6" stroke="#E8DCA8" stroke-width="2"/>
    <text x="848" y="955" class="accent medium" font-weight="700">s = H</text>
    <text x="848" y="992" class="ink small">遠景深 = 無限遠</text>
    <rect x="850" y="1018" width="270" height="15" rx="7" fill="#E67E22" opacity=".65"/>
    <text x="1135" y="1033" class="accent medium" font-weight="700">∞</text>
  </g>
  <g>
    <rect x="1195" y="910" width="335" height="175" rx="12" class="card"/>
    <text x="1223" y="955" class="ink medium" font-weight="700">s &gt; H</text>
    <text x="1223" y="992" class="muted small">遠景仍在清晰範圍</text>
    <rect x="1225" y="1018" width="250" height="15" rx="7" fill="#E67E22" opacity=".65"/>
    <text x="1480" y="1033" class="accent medium" font-weight="700">∞</text>
  </g>

  <text x="80" y="1125" class="muted small">說明：景深是 CoC 容許範圍下的清晰判定；此圖為幾何光學示意，未包含鏡頭像差、繞射及微距倍率。</text>
</svg>
